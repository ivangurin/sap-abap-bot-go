services:
  sap-abap-bot:
    image: ghcr.io/ivangurin/sap-abap-bot-go
    environment:
      - SAP_ABAP_BOT_TOKEN=$SAP_ABAP_BOT_TOKEN
      - SAP_ABAP_BOT_ADMIN_USER_IDS=$SAP_ABAP_BOT_ADMIN_USER_IDS
      - SAP_ABAP_BOT_ALLOWED_CHAT_IDS=$SAP_ABAP_BOT_ALLOWED_CHAT_IDS
      - SAP_ABAP_BOT_AI_PROVIDER=$SAP_ABAP_BOT_AI_PROVIDER
      - SAP_ABAP_BOT_GITHUB_BASE_URL=$SAP_ABAP_BOT_GITHUB_BASE_URL
      - SAP_ABAP_BOT_GITHUB_TOKEN=$SAP_ABAP_BOT_GITHUB_TOKEN
      - SAP_ABAP_BOT_GITHUB_AI_MODEL=$SAP_ABAP_BOT_GITHUB_AI_MODEL
      - SAP_ABAP_BOT_ANTHROPIC_BASE_URL=$SAP_ABAP_BOT_ANTHROPIC_BASE_URL
      - SAP_ABAP_BOT_ANTHROPIC_TOKEN=$SAP_ABAP_BOT_ANTHROPIC_TOKEN
      - SAP_ABAP_BOT_ANTHROPIC_AI_MODEL=$SAP_ABAP_BOT_ANTHROPIC_AI_MODEL
      - SAP_ABAP_BOT_LOG_LEVEL=$SAP_ABAP_BOT_LOG_LEVEL
    restart: always
